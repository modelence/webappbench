# Submissions config for `npm run bench -- score-all`.
#
# Copy to `submissions.yaml` and fill in one entry per (tool, prompt, run) that
# you want to score. Each entry is a sitebuilder's deployed preview URL — you
# drive the tool's UI manually, then record the URL here.
#
# Schema is validated at load time. Run `npm run bench -- score-all` to:
#   1. Record each entry as a submission under artifacts/{tool}/{prompt}/{run}/
#   2. Run all deterministic scorers against each URL
#   3. Regenerate leaderboard.html
#
# Only `tool`, `prompt`, and `url` are required. Everything else is optional
# user-reported metadata (folded into the Cost scorer).
#
# Optional `source` ZIP unlocks the source-only scorers: F6 (verbatim
# constraints), C1 (ESLint), C2 (TypeScript), C5 (source-byte side-stat
# alongside the gzipped network signal), C6 (complexity), C7 (maintainability
# judge), C8 (clean install), S2 (auth patterns), S3 (npm audit). Without
# source, the URL alone scores ~10 dimensions covering render, acceptance
# criteria, judges, performance, accessibility, SEO, headers, and visual.

schema: 1
runs:
  # Tier 1 — landing page. URL alone is enough; source ZIP is optional but
  # unlocks 9 additional scorers for full code-quality coverage.
  - tool: lovable
    prompt: nimbus-notes-landing
    url: https://example-nimbus-abc.lovable.app/
    # Optional source ZIP — export from Lovable → GitHub and download, or use
    # the tool's "Download code" option.
    # source: ./source-exports/lovable-nimbus.zip
    # Optional timing + cost:
    # buildSeconds: 90                          # seconds from prompt submit to working build
    # promptSubmittedAt: 2026-04-24T18:00:00Z   # alternative: provide timestamps instead
    # firstRenderAt:    2026-04-24T18:00:45Z
    # workingBuildAt:   2026-04-24T18:01:10Z
    # credits: 5
    # usd: 0.30
    # note: first pass, no iteration

  - tool: v0
    prompt: nimbus-notes-landing
    url: https://nimbus-v0.vercel.app/

  # Tier 2 — stateful localStorage app. F2's setup actions exercise empty-state,
  # add-task, persistence-across-reload, and other stateful flows; see
  # prompts/corpus/todo-localstorage.yaml for the full acceptance YAML.
  - tool: replit
    prompt: todo-localstorage
    url: https://daily-todo.your-handle.repl.co/
    # source: ./source-exports/replit-todo.zip

  # Tier 3 — backend-bearing app (v0.3 backend track). Adds an optional `backend`
  # block consumed by F7 (auth round-trip), F8 (cross-session persistence), and
  # S4 (backend security probes). Omit it and those scorers score N/A.
  #
  # The ONLY input is two test accounts. The harness signs in through the real UI
  # with each, and auto-discovers everything else (the data endpoint, the record
  # to probe, the session token) by observing each session's traffic — no
  # DevTools, no anon keys, no record ids. Create both accounts MANUALLY (never
  # automate signup for tools that prohibit it, e.g. Lovable). Use a recognizable
  # test domain like bench-<run>@<your-domain>.test.
  # - tool: lovable
  #   prompt: crm-contacts
  #   url: https://example-crm.lovable.app/
  #   backend:
  #     user_a: { email: bench-a@your-domain.test, password: "..." }
  #     user_b: { email: bench-b@your-domain.test, password: "..." }
  #     # backend_url: https://api.example-crm.com   # OPTIONAL — only if the API is on a different origin than `url`
