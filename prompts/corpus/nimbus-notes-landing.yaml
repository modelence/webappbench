id: nimbus-notes-landing
tier: 1
prompt: |
  Build a one-page landing site for 'Nimbus Notes', a minimalist note-taking app.
  Include a hero with a headline, sub-headline, and primary CTA labelled exactly
  "Get started"; a three-feature grid; testimonials (3 placeholders); and a sticky
  top nav with logo text "Nimbus Notes" and a "Get started" button.
  Palette: warm off-white background, near-black text, one accent color of your choice.

must_have:
  - id: hero_h1_present
    locator: "getByRole('heading', { level: 1 })"
    assert: "toBeVisible"
  - id: cta_above_fold
    locator: "getByRole('button', { name: /get started/i })"
    assert: "toBeVisible"
    custom: "boundingBox.y < 800"
  - id: sticky_nav
    locator: "getByRole('navigation')"
    assert: "toBeVisible"

should_have:
  # At least 3 subheadings (h2s) — proxy for "three-feature grid" without
  # requiring a specific markup style that varies per tool.
  - id: feature_subheadings
    locator: "locator('h2')"
    assert: "toHaveCountAtLeast(3)"
  # At least 3 block-quote style elements — proxy for "testimonials (3 placeholders)".
  - id: testimonials_present
    locator: "locator('blockquote, [role=\"blockquote\"]')"
    assert: "toHaveCountAtLeast(3)"

verbatim_constraints:
  - type: exact_copy
    value: "Get started"
    where: "primary CTA button label"
  - type: exact_copy
    value: "Nimbus Notes"
    where: "nav logo, hero headline"

seo_applicable:
  - title
  - meta_description
  - og_tags
  - lang
  - heading_hierarchy
