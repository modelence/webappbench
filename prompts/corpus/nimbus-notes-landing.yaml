id: nimbus-notes-landing
tier: 1
prompt: |
  Build a one-page landing site for 'Nimbus Notes', a minimalist note-taking app.
  Include a hero with a headline, sub-headline, and primary CTA labelled exactly
  "Get started"; a three-feature grid; testimonials (3 placeholders); and a sticky
  top nav with logo text "Nimbus Notes" and a "Get started" button.
  Palette: warm off-white background, near-black text, one accent color of your choice.

must_have:
  - id: hero_h1_present
    locator: "getByRole('heading', { level: 1 })"
    assert: "toBeVisible"
  - id: cta_above_fold
    locator: "getByRole('button', { name: /get started/i }).or(getByRole('link', { name: /get started/i }))"
    assert: "toBeVisible"
    custom: "boundingBox.y < 800"
  - id: sticky_nav
    locator: "getByRole('navigation')"
    assert: "toBeVisible"
    custom: "stickyAfterScroll"

should_have:
  # At least 3 subheadings (h2 or h3) — proxy for "three-feature grid" without
  # requiring a specific markup style that varies per tool. Accepts both flat
  # h2-per-feature and nested "Features" h2 + h3-per-feature layouts.
  - id: feature_subheadings
    locator: "locator('h2, h3')"
    assert: "toHaveCountAtLeast(3)"
  # At least 3 testimonial-style elements — proxy for "testimonials (3 placeholders)".
  # Accepts both semantic <blockquote>/<figure> markup and the more common
  # styled-div card pattern (id/class/data-* containing "testimonial").
  - id: testimonials_present
    locator: "locator('blockquote, [role=\"blockquote\"], figure, [id*=\"testimonial\" i], [class*=\"testimonial\" i], [data-testid*=\"testimonial\" i]')"
    assert: "toHaveCountAtLeast(3)"

verbatim_constraints:
  - type: exact_copy
    value: "Get started"
    where: "primary CTA button label"
  - type: exact_copy
    value: "Nimbus Notes"
    where: "nav logo, hero headline"

seo_applicable:
  - title
  - meta_description
  - og_tags
  - lang
  - heading_hierarchy
